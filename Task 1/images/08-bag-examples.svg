<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 662 420" width="662" height="420" role="img" aria-label="Example · shipment 10 × 6 × 2 (Max 10, Mid 6, Min 2) against two bags">
<style>
  .bg { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
  .nd { fill: #eef3f9; stroke: #5b7fa6; stroke-width: 1.5; }
  .dm { fill: #fff6d6; stroke: #c9a227; stroke-width: 1.5; }
  .ok { fill: #d9f2e6; stroke: #2f9e73; stroke-width: 1.5; }
  .no { fill: #fde2e2; stroke: #d9534f; stroke-width: 1.5; }
  .ar { stroke: #445; stroke-width: 1.5; fill: none; }
  text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  .t  { font-size: 12px; text-anchor: middle; dominant-baseline: middle; fill: #1a1a1a; }
  .ts { font-size: 10.5px; text-anchor: middle; dominant-baseline: middle; fill: #555; }
  .tb { font-size: 12px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; fill: #1a1a1a; }
  .lb { font-size: 11px; font-weight: bold; fill: #444; dominant-baseline: middle; }
  .h  { font-size: 15px; font-weight: bold; fill: #1f3864; }
</style>
<rect class="bg" x="0.5" y="0.5" width="661" height="419" rx="12"/>
<text class="h" x="20" y="28">Example · shipment 10 × 6 × 2 (Max 10, Mid 6, Min 2) against two bags</text>
<rect x="20" y="46" width="12" height="12" rx="2" fill="#4a90d9"/>
<text class="ts" style="text-anchor:start" x="37" y="52">Max or Mid</text>
<rect x="110" y="46" width="12" height="12" rx="2" fill="#f0a030"/>
<text class="ts" style="text-anchor:start" x="127" y="52">Min (added)</text>
<rect x="206" y="46" width="12" height="12" rx="2" fill="#e4e8ee" stroke="#8794a6"/>
<text class="ts" style="text-anchor:start" x="223" y="52">bag dimension</text>
<text class="tb" style="text-anchor:start" x="32" y="96">Bag A: 12 × 8 × 1   (both conditions hold exactly) → <tspan fill="#1f8a5b">fits</tspan></text>
<text class="ts" style="text-anchor:start" x="32" y="127">by length</text>
<rect x="182" y="116" width="220" height="22" fill="#4a90d9"/>
<text class="t" style="fill:#fff;font-size:11px" x="292.0" y="127">Max = 10</text>
<rect x="402" y="116" width="44" height="22" fill="#f0a030"/>
<text class="t" style="fill:#fff;font-size:11px" x="424.0" y="127">2</text>
<rect x="182" y="140" width="264" height="22" fill="#e4e8ee" stroke="#8794a6"/>
<text class="t" style="font-size:11px" x="314.0" y="151">bag length = 12</text>
<text class="tb" style="text-anchor:start;fill:#1f8a5b" x="484" y="139">10 + 2 = 12 ≤ 12 ✓</text>
<text class="ts" style="text-anchor:start" x="32" y="185">by width</text>
<rect x="182" y="174" width="132" height="22" fill="#4a90d9"/>
<text class="t" style="fill:#fff;font-size:11px" x="248.0" y="185">Mid = 6</text>
<rect x="314" y="174" width="44" height="22" fill="#f0a030"/>
<text class="t" style="fill:#fff;font-size:11px" x="336.0" y="185">2</text>
<rect x="182" y="198" width="176" height="22" fill="#e4e8ee" stroke="#8794a6"/>
<text class="t" style="font-size:11px" x="270.0" y="209">bag width = 8</text>
<text class="tb" style="text-anchor:start;fill:#1f8a5b" x="484" y="197">6 + 2 = 8 ≤ 8 ✓</text>

<rect x="16" y="74" width="630" height="154" rx="8" fill="none" stroke="#d5dce6"/>
<text class="tb" style="text-anchor:start" x="32" y="264">Bag B: 11 × 8 × 1   (too short) → <tspan fill="#c0392b">does not fit</tspan></text>
<text class="ts" style="text-anchor:start" x="32" y="295">by length</text>
<rect x="182" y="284" width="220" height="22" fill="#4a90d9"/>
<text class="t" style="fill:#fff;font-size:11px" x="292.0" y="295">Max = 10</text>
<rect x="402" y="284" width="44" height="22" fill="#f0a030"/>
<text class="t" style="fill:#fff;font-size:11px" x="424.0" y="295">2</text>
<rect x="182" y="308" width="242" height="22" fill="#e4e8ee" stroke="#8794a6"/>
<text class="t" style="font-size:11px" x="303.0" y="319">bag length = 11</text>
<text class="tb" style="text-anchor:start;fill:#c0392b" x="484" y="307">10 + 2 = 12 ≤ 11 ✗</text>
<text class="ts" style="text-anchor:start" x="32" y="353">by width</text>
<rect x="182" y="342" width="132" height="22" fill="#4a90d9"/>
<text class="t" style="fill:#fff;font-size:11px" x="248.0" y="353">Mid = 6</text>
<rect x="314" y="342" width="44" height="22" fill="#f0a030"/>
<text class="t" style="fill:#fff;font-size:11px" x="336.0" y="353">2</text>
<rect x="182" y="366" width="176" height="22" fill="#e4e8ee" stroke="#8794a6"/>
<text class="t" style="font-size:11px" x="270.0" y="377">bag width = 8</text>
<text class="tb" style="text-anchor:start;fill:#1f8a5b" x="484" y="365">6 + 2 = 8 ≤ 8 ✓</text>

<rect x="16" y="242" width="630" height="154" rx="8" fill="none" stroke="#d5dce6"/>
</svg>
