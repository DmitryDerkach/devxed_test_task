<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 536" width="640" height="536" role="img" aria-label="Example · shipment 10 × 6 × 4 against two boxes">
<style>
  .bg { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
  .nd { fill: #eef3f9; stroke: #5b7fa6; stroke-width: 1.5; }
  .dm { fill: #fff6d6; stroke: #c9a227; stroke-width: 1.5; }
  .ok { fill: #d9f2e6; stroke: #2f9e73; stroke-width: 1.5; }
  .no { fill: #fde2e2; stroke: #d9534f; stroke-width: 1.5; }
  .ar { stroke: #445; stroke-width: 1.5; fill: none; }
  text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  .t  { font-size: 12px; text-anchor: middle; dominant-baseline: middle; fill: #1a1a1a; }
  .ts { font-size: 10.5px; text-anchor: middle; dominant-baseline: middle; fill: #555; }
  .tb { font-size: 12px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; fill: #1a1a1a; }
  .lb { font-size: 11px; font-weight: bold; fill: #444; dominant-baseline: middle; }
  .h  { font-size: 15px; font-weight: bold; fill: #1f3864; }
</style>
<rect class="bg" x="0.5" y="0.5" width="639" height="535" rx="12"/>
<text class="h" x="20" y="28">Example · shipment 10 × 6 × 4 against two boxes</text>
<rect x="20" y="46" width="12" height="12" rx="2" fill="#4a90d9"/>
<text class="ts" style="text-anchor:start" x="37" y="52">shipment dimension</text>
<rect x="158" y="46" width="12" height="12" rx="2" fill="#e4e8ee" stroke="#8794a6"/>
<text class="ts" style="text-anchor:start" x="175" y="52">box dimension</text>
<text class="tb" style="text-anchor:start" x="32" y="96">Box A: 12 × 7 × 5 → <tspan fill="#1f8a5b">fits</tspan></text>
<text class="ts" style="text-anchor:start" x="32" y="127">1st (largest)</text>
<rect x="182" y="116" width="220" height="22" fill="#4a90d9"/>
<text class="t" style="fill:#fff;font-size:11px" x="292.0" y="127">10</text>
<rect x="182" y="140" width="264" height="22" fill="#e4e8ee" stroke="#8794a6"/>
<text class="t" style="font-size:11px" x="314.0" y="151">12</text>
<text class="tb" style="text-anchor:start;fill:#1f8a5b" x="484" y="139">12 ≥ 10 ✓</text>
<text class="ts" style="text-anchor:start" x="32" y="185">2nd (middle)</text>
<rect x="182" y="174" width="132" height="22" fill="#4a90d9"/>
<text class="t" style="fill:#fff;font-size:11px" x="248.0" y="185">6</text>
<rect x="182" y="198" width="154" height="22" fill="#e4e8ee" stroke="#8794a6"/>
<text class="t" style="font-size:11px" x="259.0" y="209">7</text>
<text class="tb" style="text-anchor:start;fill:#1f8a5b" x="484" y="197">7 ≥ 6 ✓</text>
<text class="ts" style="text-anchor:start" x="32" y="243">3rd (smallest)</text>
<rect x="182" y="232" width="88" height="22" fill="#4a90d9"/>
<text class="t" style="fill:#fff;font-size:11px" x="226.0" y="243">4</text>
<rect x="182" y="256" width="110" height="22" fill="#e4e8ee" stroke="#8794a6"/>
<text class="t" style="font-size:11px" x="237.0" y="267">5</text>
<text class="tb" style="text-anchor:start;fill:#1f8a5b" x="484" y="255">5 ≥ 4 ✓</text>

<rect x="16" y="74" width="608" height="212" rx="8" fill="none" stroke="#d5dce6"/>
<text class="tb" style="text-anchor:start" x="32" y="322">Box B: 11 × 5 × 5  (more volume than needed: 275 > 240) → <tspan fill="#c0392b">does not fit</tspan></text>
<text class="ts" style="text-anchor:start" x="32" y="353">1st (largest)</text>
<rect x="182" y="342" width="220" height="22" fill="#4a90d9"/>
<text class="t" style="fill:#fff;font-size:11px" x="292.0" y="353">10</text>
<rect x="182" y="366" width="242" height="22" fill="#e4e8ee" stroke="#8794a6"/>
<text class="t" style="font-size:11px" x="303.0" y="377">11</text>
<text class="tb" style="text-anchor:start;fill:#1f8a5b" x="484" y="365">11 ≥ 10 ✓</text>
<text class="ts" style="text-anchor:start" x="32" y="411">2nd (middle)</text>
<rect x="182" y="400" width="132" height="22" fill="#4a90d9"/>
<text class="t" style="fill:#fff;font-size:11px" x="248.0" y="411">6</text>
<rect x="182" y="424" width="110" height="22" fill="#e4e8ee" stroke="#8794a6"/>
<text class="t" style="font-size:11px" x="237.0" y="435">5</text>
<text class="tb" style="text-anchor:start;fill:#c0392b" x="484" y="423">5 ≥ 6 ✗</text>
<text class="ts" style="text-anchor:start" x="32" y="469">3rd (smallest)</text>
<rect x="182" y="458" width="88" height="22" fill="#4a90d9"/>
<text class="t" style="fill:#fff;font-size:11px" x="226.0" y="469">4</text>
<rect x="182" y="482" width="110" height="22" fill="#e4e8ee" stroke="#8794a6"/>
<text class="t" style="font-size:11px" x="237.0" y="493">5</text>
<text class="tb" style="text-anchor:start;fill:#1f8a5b" x="484" y="481">5 ≥ 4 ✓</text>

<rect x="16" y="300" width="608" height="212" rx="8" fill="none" stroke="#d5dce6"/>
</svg>
