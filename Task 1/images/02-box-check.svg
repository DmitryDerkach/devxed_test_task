<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 556" width="672" height="556" role="img" aria-label="Box check">
<style>
  .bg { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
  .nd { fill: #eef3f9; stroke: #5b7fa6; stroke-width: 1.5; }
  .dm { fill: #fff6d6; stroke: #c9a227; stroke-width: 1.5; }
  .ok { fill: #d9f2e6; stroke: #2f9e73; stroke-width: 1.5; }
  .no { fill: #fde2e2; stroke: #d9534f; stroke-width: 1.5; }
  .ar { stroke: #445; stroke-width: 1.5; fill: none; }
  text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  .t  { font-size: 12px; text-anchor: middle; dominant-baseline: middle; fill: #1a1a1a; }
  .ts { font-size: 10.5px; text-anchor: middle; dominant-baseline: middle; fill: #555; }
  .tb { font-size: 12px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; fill: #1a1a1a; }
  .lb { font-size: 11px; font-weight: bold; fill: #444; dominant-baseline: middle; }
  .h  { font-size: 15px; font-weight: bold; fill: #1f3864; }
</style>
<rect class="bg" x="0.5" y="0.5" width="671" height="555" rx="12"/>
<text class="h" x="20" y="28">Diagram 2 · Box check: three comparisons by position</text>
<g transform="translate(16,50)">
  <defs><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#445"/></marker></defs>

  <rect class="nd" x="60" y="10" width="340" height="44" rx="8"/>
  <text class="t" x="230" y="26">Shipment dimensions, descending:</text>
  <text class="t" x="230" y="43">S1 ≥ S2 ≥ S3 (S1 is the largest)</text>
  <line class="ar" x1="230" y1="54" x2="230" y2="73" marker-end="url(#a2)"/>

  <rect class="nd" x="60" y="74" width="340" height="44" rx="8"/>
  <text class="t" x="230" y="90">Box dimensions, descending:</text>
  <text class="t" x="230" y="107">B1 ≥ B2 ≥ B3 (B1 is the largest)</text>
  <line class="ar" x1="230" y1="118" x2="230" y2="161" marker-end="url(#a2)"/>

  <polygon class="dm" points="230,162 350,190 230,218 110,190"/>
  <text class="tb" x="230" y="183">B1 ≥ S1 ?</text>
  <text class="ts" x="230" y="200">largest vs largest</text>
  <line class="ar" x1="230" y1="218" x2="230" y2="251" marker-end="url(#a2)"/>
  <text class="lb" x="240" y="238" fill="#1f8a5b">Yes</text>

  <polygon class="dm" points="230,252 350,280 230,308 110,280"/>
  <text class="tb" x="230" y="273">B2 ≥ S2 ?</text>
  <text class="ts" x="230" y="290">middle vs middle</text>
  <line class="ar" x1="230" y1="308" x2="230" y2="341" marker-end="url(#a2)"/>
  <text class="lb" x="240" y="328" fill="#1f8a5b">Yes</text>

  <polygon class="dm" points="230,342 350,370 230,398 110,370"/>
  <text class="tb" x="230" y="363">B3 ≥ S3 ?</text>
  <text class="ts" x="230" y="380">smallest vs smallest</text>
  <line class="ar" x1="230" y1="398" x2="230" y2="419" marker-end="url(#a2)"/>
  <text class="lb" x="240" y="411" fill="#1f8a5b">Yes</text>

  <rect class="ok" x="60" y="420" width="340" height="44" rx="22"/>
  <text class="tb" x="230" y="442">Box fits</text>

  <rect class="no" x="430" y="250" width="190" height="60" rx="8"/>
  <text class="tb" x="525" y="270">Box does not fit</text>
  <text class="ts" x="525" y="290">(at least one comparison failed)</text>
  <path class="ar" d="M350,190 H525 V248" marker-end="url(#a2)"/>
  <line class="ar" x1="350" y1="280" x2="428" y2="280" marker-end="url(#a2)"/>
  <path class="ar" d="M350,370 H525 V312" marker-end="url(#a2)"/>
  <text class="lb" x="357" y="183" fill="#c0392b">No</text>
  <text class="lb" x="357" y="273" fill="#c0392b">No</text>
  <text class="lb" x="357" y="363" fill="#c0392b">No</text>
</g>
</svg>
