<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 586" width="672" height="586" role="img" aria-label="Cross-section, perimeter and the bag as a ring">
<style>
  .bg { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
  .nd { fill: #eef3f9; stroke: #5b7fa6; stroke-width: 1.5; }
  .dm { fill: #fff6d6; stroke: #c9a227; stroke-width: 1.5; }
  .ok { fill: #d9f2e6; stroke: #2f9e73; stroke-width: 1.5; }
  .no { fill: #fde2e2; stroke: #d9534f; stroke-width: 1.5; }
  .ar { stroke: #445; stroke-width: 1.5; fill: none; }
  text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  .t  { font-size: 12px; text-anchor: middle; dominant-baseline: middle; fill: #1a1a1a; }
  .ts { font-size: 10.5px; text-anchor: middle; dominant-baseline: middle; fill: #555; }
  .tb { font-size: 12px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; fill: #1a1a1a; }
  .lb { font-size: 11px; font-weight: bold; fill: #444; dominant-baseline: middle; }
  .h  { font-size: 15px; font-weight: bold; fill: #1f3864; }
</style>
<rect class="bg" x="0.5" y="0.5" width="671" height="585" rx="12"/>
<text class="h" x="20" y="28">Diagram 3 · Where “Mid + Min ≤ width” comes from</text>
<g transform="translate(16,50)">
  <defs><marker id="a5" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#445"/></marker></defs>

  <text class="lb" x="20" y="16">1. Cross-section = the item seen from its end (or cut across)</text>
  <g transform="translate(40,0)">
    <polygon points="40,80 160,80 220,50 100,50" fill="#cfe2f7" stroke="#4a90d9" stroke-width="1.5"/>
    <polygon points="160,80 220,50 220,90 160,120" fill="#b7d0ee" stroke="#4a90d9" stroke-width="1.5"/>
    <rect x="40" y="80" width="120" height="40" fill="#f6c27a" stroke="#f0a030" stroke-width="2"/>
    <text class="tb" x="100" y="100">section</text>
    <text class="ts" x="100" y="136">Mid = 6</text>
    <text class="ts" style="text-anchor:end" x="32" y="100">Min = 2</text>
    <text class="ts" x="160" y="38">Max = 10 (goes into depth)</text>
  </g>
  <text class="t" style="text-anchor:start" x="300" y="62">The item is a bar 10 × 6 × 2 (Max × Mid × Min).</text>
  <text class="t" style="text-anchor:start" x="300" y="82">Look at it from the end, i.e. along its</text>
  <text class="t" style="text-anchor:start" x="300" y="102">longest side. We see a rectangle</text>
  <text class="t" style="text-anchor:start" x="300" y="122">Mid × Min = 6 × 2. That is the cross-section.</text>

  <text class="lb" x="20" y="166">2. Perimeter of the section = the sum of all four sides of the rectangle</text>
  <rect x="60" y="200" width="180" height="60" fill="#f6c27a" stroke="#f0a030" stroke-width="2"/>
  <text class="ts" x="150" y="190">Mid = 6</text>
  <text class="ts" x="150" y="276">Mid = 6</text>
  <text class="ts" style="text-anchor:end" x="52" y="230">Min = 2</text>
  <text class="ts" style="text-anchor:start" x="248" y="230">Min = 2</text>
  <text class="t" x="150" y="230">section 6 × 2</text>
  <line class="ar" x1="302" y1="230" x2="324" y2="230" marker-end="url(#a5)"/>
  <text class="ts" x="474" y="205">the same four sides laid out in a row</text>
  <rect x="330" y="214" width="108" height="32" fill="#4a90d9"/>
  <rect x="438" y="214" width="36" height="32" fill="#f0a030"/>
  <rect x="474" y="214" width="108" height="32" fill="#4a90d9"/>
  <rect x="582" y="214" width="36" height="32" fill="#f0a030"/>
  <text class="t" style="fill:#fff" x="384" y="230">6</text>
  <text class="t" style="fill:#fff" x="456" y="230">2</text>
  <text class="t" style="fill:#fff" x="528" y="230">6</text>
  <text class="t" style="fill:#fff" x="600" y="230">2</text>
  <path d="M330,256 V264 H618 V256" stroke="#444" fill="none"/>
  <text class="tb" x="474" y="282">perimeter = 6 + 2 + 6 + 2 = 2 · (6 + 2) = 16</text>

  <text class="lb" x="20" y="318">3. A flat bag of width W is a “ring” of length 2W (example: W = 8)</text>
  <text class="ts" x="180" y="338">bag seen from the end: W = 8 (two sides)</text>
  <line x1="60" y1="352" x2="300" y2="352" stroke="#f0a030" stroke-width="5"/>
  <line x1="60" y1="366" x2="300" y2="366" stroke="#f0a030" stroke-width="5"/>
  <line x1="60" y1="352" x2="60" y2="366" stroke="#333" stroke-width="5"/>
  <line x1="300" y1="352" x2="300" y2="366" stroke="#333" stroke-width="5"/>
  <text class="t" x="180" y="392">film all around: 8 + 8 = 2W = 16</text>
  <text class="ts" x="336" y="347">opened</text>
  <line class="ar" x1="316" y1="359" x2="356" y2="359" marker-end="url(#a5)"/>
  <rect x="380" y="340" width="180" height="60" fill="#f6c27a" stroke="#f0a030" stroke-width="5"/>
  <line x1="560" y1="370" x2="592" y2="370" stroke="#333" stroke-width="6"/>
  <text class="t" x="470" y="370">item 6 × 2</text>
  <text class="ts" x="470" y="418">the film wraps around the item: its length is 2W = 16</text>

  <rect x="20" y="432" width="600" height="76" rx="6" fill="#fff9e6" stroke="#ecd98a"/>
  <text class="t" x="320" y="451">The film does not stretch, so the bag “ring” must be at least the item perimeter:</text>
  <text class="tb" style="font-size:15px" x="320" y="475">2W ≥ 2 · (Mid + Min)   ⇒   W ≥ Mid + Min</text>
  <text class="ts" x="320" y="496">here 16 ≥ 16, so a bag of width 8 fits exactly (width 7: 14 &lt; 16 - does not fit)</text>
</g>
</svg>
